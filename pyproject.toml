[project]
name = "mcp-careers"
version = "0.1.3"
description = "Apply to NimbleBrain through your agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "NimbleBrain Inc", email = "hello@nimblebrain.ai" }]
dependencies = [
    "aiohttp>=3.11",
    "fastmcp>=4.2,<5",
    # NimbleBrain's own SDK, held to one minor: a v0.x minor may break the API.
    "nimblebrain-server-sdk>=0.8.1,<0.9",
    "pydantic>=2",
    "pyyaml>=6",
    "redis>=5.2",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://nimblebrain.ai/careers"
Repository = "https://github.com/NimbleBrainInc/mcp-careers"

[dependency-groups]
dev = [
    "fakeredis>=2.26",
    "pytest>=8.4",
    "pytest-asyncio>=0.24",
    "ruff>=0.13",
    "ty>=0.0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_careers"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "C4"]

[tool.ruff.lint.per-file-ignores]
# The page's CSS and markup are long string literals.
"src/mcp_careers/pages.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
