name: CI

# Verify on every push and pull request. On merge to main, build and push the image and roll
# staging through GitOps. The build and roll jobs skip until their variables and secrets are
# provisioned (deploy/README.md), so this stays green before then and on forks.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint + type + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # CI runs the uv the image copies in, read from the Dockerfile's
      # `COPY --from=ghcr.io/astral-sh/uv:<version>@sha256:…` line, so a green
      # `uv sync --locked` here is a verdict from the image's own uv. No match, or more
      # than one, fails the step rather than falling back to the latest uv.
      - name: uv version from the Dockerfile
        id: uv
        run: |
          version=$(sed -nE 's#^COPY --from=ghcr\.io/astral-sh/uv:([0-9][0-9A-Za-z.+-]*)@sha256:.*#\1#p' Dockerfile)
          if [ -z "$version" ] || [ "$(printf '%s\n' "$version" | wc -l)" -ne 1 ]; then
            echo "expected one COPY --from=ghcr.io/astral-sh/uv:<version>@sha256:<digest> line in Dockerfile, found: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true
      # --locked fails the run when pyproject.toml and uv.lock disagree, so this tests the
      # exact dependency set the image installs.
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check src
      - run: uv run pytest -q

  build-and-push:
    name: Build & push image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      # The bare short SHA: the immutable per-commit tag staging runs, and the image a
      # release later retags to a version without rebuilding.
      - name: Image tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/mcp-careers:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  roll-staging:
    name: Roll staging
    needs: build-and-push
    # `!cancelled()` matters: without a status function GitHub adds an implicit success()
    # over needs, which a skipped build would poison.
    if: ${{ !cancelled() && needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-latest
    # The edge-bump key is a secret of this environment, which admits only `main`, so a
    # pull_request run cannot read a key that writes deploy config.
    environment: deploy-config-edge
    permissions: {}
    steps:
      - name: Check edge-bump config
        id: cfg
        env:
          APP_ID: ${{ vars.EDGE_BUMP_APP_ID }}
          REPO: ${{ vars.DEPLOY_CONFIG_REPO }}
          KEY: ${{ secrets.EDGE_BUMP_APP_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$REPO" ] && [ -n "$KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "edge-bump not configured (need EDGE_BUMP_APP_ID + DEPLOY_CONFIG_REPO vars + EDGE_BUMP_APP_KEY secret); skipping"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint deploy-repo token
        if: steps.cfg.outputs.enabled == 'true'
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.EDGE_BUMP_APP_ID }}
          private-key: ${{ secrets.EDGE_BUMP_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.DEPLOY_CONFIG_REPO }}
      - name: Dispatch fleet-image-pushed
        if: steps.cfg.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        # -f (raw string), not -F: -F would turn an all-digit tag into a JSON number.
        run: |
          gh api "repos/${{ github.repository_owner }}/${{ vars.DEPLOY_CONFIG_REPO }}/dispatches" \
            -f event_type=fleet-image-pushed \
            -f "client_payload[component]=mcp-careers" \
            -f "client_payload[sha]=${{ needs.build-and-push.outputs.tag }}"

  # A failed run on main posts to Slack as well as GitHub's own notification, which reaches
  # only whoever triggered the run. Dormant until CI_SLACK_WEBHOOK_URL is set.
  notify-failure:
    name: Notify Slack on failure
    needs: [verify, build-and-push, roll-staging]
    if: ${{ failure() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Post to Slack
        env:
          WEBHOOK: ${{ secrets.CI_SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "CI_SLACK_WEBHOOK_URL is not set: GitHub's failed-run notification is the only alert"
            exit 0
          fi
          jq -n --arg text ":red_circle: ${GITHUB_WORKFLOW} failed on ${GITHUB_REPOSITORY} (${GITHUB_REF_NAME}): ${RUN_URL}" '{text: $text}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK"
